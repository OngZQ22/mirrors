<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRRORS — The Right to Be Bored</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#f1e9f2}
  *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  input{-webkit-user-select:text;user-select:text}
  ::selection{background:transparent}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
  #stage{position:fixed;inset:0;background:#000;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity 1.7s ease-in-out}
  .bg.on{opacity:1}
  .kb{animation:ken 32s ease-out forwards}
  @keyframes ken{from{transform:scale(1.0)}to{transform:scale(1.04)}}
  #warm,#cold,#vig,#rain{position:absolute;inset:0;pointer-events:none;transition:opacity 1.8s}
  #warm{background:#ff9a3c;opacity:.16;mix-blend-mode:soft-light}
  #cold{background:#2c4c76;opacity:.22;mix-blend-mode:soft-light}
  #vig{box-shadow:inset 0 0 240px 70px rgba(0,0,0,.66)}
  #rain{opacity:0;background-image:repeating-linear-gradient(101deg,transparent 0 24px,rgba(180,205,255,.045) 24px 25px);animation:rain 1.15s linear infinite}
  @keyframes rain{to{transform:translateY(25px)}}
  .bar{position:absolute;left:0;right:0;height:6vh;background:#000;z-index:6;display:none}
  #barTop{top:0}#barBot{bottom:0}
  #cap{position:absolute;left:0;right:0;bottom:6vh;z-index:7;padding:22px 9vw 30px;
    background:linear-gradient(180deg,rgba(4,3,7,0),rgba(4,3,7,.72) 48%,rgba(4,3,7,.93));display:none}
  #who{font-style:italic;letter-spacing:2px;color:#cbb8d6;font-size:14px;margin-bottom:6px;min-height:16px}
  #who.wren{color:var(--wc,#ff9ecb);text-shadow:0 0 10px rgba(255,120,190,.45)}
  #who.you{color:var(--pc,#7fdcff);text-shadow:0 0 10px rgba(90,200,255,.45)}
  #who.oth{color:#ffd08a;text-shadow:0 0 10px rgba(255,200,120,.4)}
  #text{font-size:20px;line-height:1.72;max-width:880px;min-height:60px;text-shadow:0 2px 12px rgba(0,0,0,.95)}
  #text em{color:#c3b4cf;font-style:italic}
  #hint{margin-top:10px;font-size:10px;letter-spacing:3px;color:#8f81a0;text-transform:uppercase;opacity:0;transition:opacity .6s}
  #choices{position:absolute;left:0;right:0;bottom:22vh;z-index:8;display:none;flex-direction:column;align-items:center;gap:12px}
  .choice{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-width:min(560px,80vw);max-width:80vw;text-align:left;font-family:inherit;
    font-size:17px;color:#f1e9f2;background:rgba(10,8,16,.66);border:1px solid rgba(255,255,255,.16);padding:12px 16px;
    border-radius:9px;cursor:pointer;transition:.2s;opacity:0;animation:rise .55s forwards;backdrop-filter:blur(2px)}
  @keyframes rise{to{opacity:1}}
  .choice:hover,.choice.hot{background:rgba(255,158,120,.16);border-color:#ffb14e;transform:translateY(-1px)}
  .choice.chosen{background:rgba(255,150,90,.22)!important;border-color:#ffb14e!important;filter:brightness(.58);transform:scale(.985);transition:filter .18s,transform .18s,background .18s}
  .choice .key{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid rgba(180,200,220,.4);display:flex;align-items:center;justify-content:center;font-size:13px;color:#bcd2e2;font-family:'Courier New',monospace;background:rgba(255,255,255,.05)}
  .choice:hover .key,.choice.hot .key{border-color:#ffb14e;color:#ffd08a}
  .choice .lbl{flex:1}
  #card{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:0 8vw;text-align:center;background:rgba(2,2,6,.55);opacity:0;transition:opacity 1.3s}
  #card .ct{font-size:clamp(20px,3.2vw,30px);font-style:italic;line-height:1.8;max-width:760px;text-shadow:0 2px 18px #000,0 0 30px rgba(255,158,203,.15)}
  /* settings */
  #gear{position:absolute;top:14px;right:76px;z-index:31;font-family:Georgia;font-size:12px;letter-spacing:1px;color:#b7a6c6;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;cursor:pointer}
  #setPanel{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(3,3,8,.8)}
  .sp{width:min(430px,92vw);background:#100d18;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:22px 26px;font-size:13px;color:#d8cee2}
  .sp h3{letter-spacing:5px;font-size:13px;color:#cbb8d6;margin:0 0 14px;font-weight:400}
  .srow{display:flex;align-items:center;gap:9px;margin:12px 0}
  .srow label{width:64px;flex:none;font-size:10px;letter-spacing:2px;color:#9a8fae;text-transform:uppercase}
  .srow input[type=range]{flex:1;accent-color:#ffb14e}
  .sw{width:21px;height:21px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15)}
  .sw.on{border-color:#fff}
  .fbtn{font-family:inherit;padding:6px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#d8cee2;cursor:pointer;font-size:12px}
  /* neon sign buttons — same language as the mirror's frame */
  .endb{font-family:Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:4px;text-transform:uppercase;
    color:#a9f0ff;background:rgba(73,224,255,.07);border:1.6px solid #49e0ff;border-radius:10px;
    padding:13px 26px;cursor:pointer;transition:.3s;
    text-shadow:0 0 10px #49e0ff,0 0 22px rgba(73,224,255,.6);
    box-shadow:0 0 16px rgba(73,224,255,.45),inset 0 0 16px rgba(73,224,255,.14);
    animation:neonHum 3.4s ease-in-out infinite}
  .endb:hover{color:#eaffff;background:rgba(73,224,255,.16);letter-spacing:5px;
    box-shadow:0 0 32px rgba(73,224,255,.85),inset 0 0 22px rgba(73,224,255,.25);animation:none}
  .endb.pink{color:#ffc2e0;background:rgba(255,93,177,.07);border-color:#ff5db1;
    text-shadow:0 0 10px #ff5db1,0 0 22px rgba(255,93,177,.6);
    box-shadow:0 0 16px rgba(255,93,177,.45),inset 0 0 16px rgba(255,93,177,.14);animation-delay:1.1s}
  .endb.pink:hover{color:#fff0f7;background:rgba(255,93,177,.18);
    box-shadow:0 0 32px rgba(255,93,177,.85),inset 0 0 22px rgba(255,93,177,.25)}
  @keyframes neonHum{0%,100%{filter:brightness(1)}45%{filter:brightness(1.16)}52%{filter:brightness(.94)}}
  .fbtn.on{border-color:#ffb14e;color:#ffd08a}
  #spSave{margin-top:16px;font-size:10.5px;font-style:italic;color:#9a8fae;text-align:center;line-height:1.7;min-height:15px}
  #spClose{margin-top:10px;width:100%;padding:9px;border-radius:8px;border:0;background:#ffb14e;color:#120c16;letter-spacing:3px;cursor:pointer;font-family:inherit}
  #spQuit{margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#9fb8c8;letter-spacing:3px;cursor:pointer;font-family:inherit;font-size:11px}
  #spQuit:hover{border-color:#ff9ecb;color:#ffd7e8}
  /* name ask */
  #nameAsk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:none;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity 1s}
  #nameAsk .nq{font-style:italic;color:#dbe6ee;font-size:18px;text-shadow:0 2px 10px #000}
  #nameIn{background:rgba(10,16,26,.82);border:1px solid rgba(150,185,205,.4);border-radius:8px;color:#eef6fc;font-family:inherit;font-size:17px;font-style:italic;text-align:center;padding:9px 14px;width:230px;outline:none}
  #nameGo{font-style:italic;font-size:13px;letter-spacing:3px;color:#8fb0c2;cursor:pointer;padding:8px 18px;border:1px solid rgba(150,185,205,.3);border-radius:8px}
  #nameGo:hover{color:#eaf6fc;border-color:rgba(180,215,235,.6)}
  /* archive */
  #archive{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(3,4,9,.96);font-family:Georgia,serif;opacity:0;transition:opacity .7s}
  #archive .ar{transform:translateY(14px);transition:transform .7s}
  #archive.in{opacity:1}#archive.in .ar{transform:translateY(0)}
  .ar{width:min(660px,94vw);max-height:88vh;overflow:auto;background:#0c0a14;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:22px 24px}
  .arh{letter-spacing:6px;font-size:13px;color:#ff9ecb;margin-bottom:4px;text-align:center}
  #arCount{text-align:center;font-size:11px;letter-spacing:2px;color:#8f81a0;margin-bottom:16px}
  #arFirst{display:none;text-align:center;padding:15px 12px;margin-bottom:16px;border-radius:10px;border:1px solid rgba(255,177,78,.3);background:rgba(255,177,78,.05)}
  .arow{display:flex;gap:13px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}
  .arow canvas{width:150px;height:44px;flex:none;background:rgba(8,6,14,.7);border-radius:7px;border:1px solid rgba(255,140,190,.18)}
  .arow .an{font-size:14px;color:#ffd7e8;letter-spacing:1px}
  .arow .at{font-size:11.5px;color:#9fb8c8;font-style:italic;margin-top:2px}
  .arow.lock .an{color:#4c4458}.arow.lock canvas{opacity:.25;filter:grayscale(1)}
  .arow:hover{background:rgba(255,255,255,.03)}
  .arow.playing canvas{border-color:#ff9ecb;box-shadow:0 0 18px rgba(255,120,180,.35)}
  #arClose{margin-top:18px;width:100%;padding:9px;border-radius:8px;border:0;background:#ffb14e;color:#120c16;letter-spacing:3px;cursor:pointer;font-family:inherit}
  /* pause taunt */
  #taunt{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(2,3,6,.9);text-align:center;opacity:0;transition:opacity .45s}
  #taunt .tt{font-style:italic;font-size:clamp(19px,2.8vw,26px);color:#cfe6f2;text-shadow:0 0 24px rgba(120,180,210,.5);line-height:1.8;max-width:640px;padding:0 6vw}
  /* mirror interlude (glass panel) */
  #mirror.cut #mline,#mirror.fin #mline{top:50%;bottom:auto;transform:translate(-50%,-50%);font-size:clamp(18px,2.4vw,23px);color:#eaf6fd;width:min(430px,64vw);text-shadow:0 0 26px rgba(120,190,225,.6),0 2px 12px #000}
  #timerwrap{display:none;flex-direction:column;align-items:center;gap:7px;width:min(300px,60vw);margin-top:4px}
  #tlabel{font-style:italic;font-size:11px;letter-spacing:3px;color:#9a7fb0;opacity:.3;text-transform:uppercase;transition:opacity .3s,color .3s}
  #ttrack{width:100%;height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
  #tbar{height:100%;width:100%;transform-origin:left;border-radius:6px;background:linear-gradient(90deg,#7fe0ff,#c9a0ff,#ff7fc4);box-shadow:0 0 12px rgba(200,140,220,.55)}
  /* mirror */
  #mirror{position:absolute;inset:0;z-index:20;background:#04060a;display:none}
  /* opening (neon mirror) */
  #opening{position:fixed;inset:0;z-index:30;background:#04050a;overflow:hidden;transition:opacity 1.6s}
  #oc{position:absolute;inset:0;width:100%;height:100%}
  #oMenu{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:15px;z-index:2;transition:opacity .5s}
  /* the row is the hover target and never moves — only the inner text flips, so no flicker */
  .omi{font-style:italic;font-size:20px;letter-spacing:3px;color:#8ea3b0;cursor:pointer;
       padding:7px 34px;display:block;text-align:center;transition:color .3s,text-shadow .3s}
  .omi .omt{display:inline-block;transform:scaleX(-1);transition:transform .55s cubic-bezier(.2,.75,.3,1);will-change:transform}
  .omi:hover{color:#eef6fc;text-shadow:0 0 16px rgba(150,210,235,.8)}
  .omi:hover .omt{transform:scaleX(1)}
  /* touch devices have no hover — right the words automatically so they're readable */
  @media (hover:none),(pointer:coarse){
    .omi .omt{transform:scaleX(1);transition:transform 1.4s cubic-bezier(.2,.8,.25,1)}
    #oMenu.mirrored .omt{transform:scaleX(-1)}
  }
  .omi.fresh{color:#ff9ecb;animation:freshGlow 2.6s ease-in-out infinite}
  @keyframes freshGlow{0%,100%{text-shadow:0 0 10px rgba(255,120,190,.35)}50%{text-shadow:0 0 22px rgba(255,120,190,.85)}}
  #oLine{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:min(600px,88%);text-align:center;color:#dbe6ee;font-style:italic;font-size:19px;opacity:0;transition:opacity 1.2s;text-shadow:0 0 20px rgba(120,175,205,.45),0 2px 8px #000;z-index:2}
  #oStep{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-style:italic;font-size:15px;letter-spacing:4px;color:#8fb0c2;cursor:pointer;opacity:0;transition:opacity 1.2s;padding:9px 20px;border:1px solid rgba(150,185,205,.3);border-radius:8px;z-index:2}
  #oStep:hover{color:#eaf6fc;border-color:rgba(180,215,235,.6);text-shadow:0 0 14px rgba(150,210,235,.7)}
  #mcanvas{position:absolute;inset:0;width:100%;height:100%}
  #mline{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:min(660px,84vw);text-align:center;
    font-style:italic;color:#cbdae6;font-size:21px;line-height:1.7;opacity:0;transition:opacity 1.2s;
    text-shadow:0 0 20px rgba(120,180,210,.4),0 2px 10px #000;pointer-events:none}
  #mstep{position:absolute;left:50%;top:85%;transform:translateX(-50%);z-index:22;font-style:italic;font-size:13px;
    letter-spacing:4px;color:#8fb0c2;cursor:pointer;opacity:0;transition:opacity 1.4s;padding:11px 22px;
    border:1px solid rgba(150,185,205,.28);border-radius:9px}
  #mstep:hover{color:#dff0f8;border-color:rgba(180,215,235,.6)}
  #title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%,#1a1422,#050308);text-align:center}
  #title h1{letter-spacing:20px;font-size:40px;text-shadow:0 0 34px rgba(255,127,196,.45)}
  #title .s{letter-spacing:9px;color:#b7a6c6;font-size:12px;margin:16px 0 34px}
  .btn{font-family:inherit;letter-spacing:5px;font-size:13px;color:#120c16;background:#ffb14e;border:0;padding:14px 32px;border-radius:6px;cursor:pointer;text-transform:uppercase}
  .btn:hover{background:#ffd08a}
  #snd{position:absolute;top:14px;right:16px;z-index:31;font-family:Georgia;font-size:12px;letter-spacing:1px;color:#b7a6c6;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;cursor:pointer}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <img id="bgA" class="bg" alt=""><img id="bgB" class="bg" alt="">
  <div id="warm"></div><div id="cold"></div><div id="rain"></div><div id="vig"></div>
  <div class="bar" id="barTop"></div><div class="bar" id="barBot"></div>
  <div id="cap"><div id="who"></div><div id="text"></div><div id="hint">▸ click to continue</div></div>
  <div id="choices"></div>
  <div id="card"><div class="ct"></div></div>
  <div id="mirror"><canvas id="mcanvas"></canvas><div id="mline"></div></div>
  <div id="mstep" onclick="enterStory()">step through ▸</div>
</div>
<button id="snd" onclick="toggleSnd()">♪ on</button>
<button id="gear">⚙ settings</button>
<div id="opening">
  <canvas id="oc"></canvas>
  <nav id="oMenu"><div class="omi" id="oStart"><span class="omt">start game</span></div><div class="omi" id="oLoad"><span class="omt">load game</span></div><div class="omi" id="oArch" style="display:none"><span class="omt">pulse archive</span></div><div class="omi" id="oSet"><span class="omt">settings</span></div></nav>
  <div id="oLine"></div>
  <div id="oStep">step through ▸</div>
  <div id="nameAsk">
    <div class="nq">Before you step through — what do they call you?</div>
    <input id="nameIn" maxlength="14" placeholder="type a name" autocomplete="off">
    <div id="nameGo">that’s me ▸</div>
  </div>
</div>
<div id="setPanel"><div class="sp">
  <h3 id="spHead">SETTINGS</h3>
  <div class="srow"><label>music</label><input type="range" id="vMus" min="0" max="100" value="100"></div>
  <div class="srow"><label>rain</label><input type="range" id="vRain" min="0" max="100" value="100"></div>
  <div class="srow"><label>effects</label><input type="range" id="vSfx" min="0" max="100" value="100"></div>
  <div class="srow"><label>font</label>
    <button class="fbtn" data-f="Georgia,'Times New Roman',serif">Book</button>
    <button class="fbtn" data-f="'Courier New',monospace">Typewriter</button>
    <button class="fbtn" data-f="'Segoe UI',system-ui,sans-serif">Modern</button></div>
  <div class="srow"><label>you</label>
    <span class="sw" data-t="pc" data-c="#7fdcff" style="background:#7fdcff"></span>
    <span class="sw" data-t="pc" data-c="#ffd08a" style="background:#ffd08a"></span>
    <span class="sw" data-t="pc" data-c="#9effa5" style="background:#9effa5"></span>
    <span class="sw" data-t="pc" data-c="#d0b0ff" style="background:#d0b0ff"></span>
    <span class="sw" data-t="pc" data-c="#f2f2f2" style="background:#f2f2f2"></span></div>
  <div class="srow"><label>wren</label>
    <span class="sw" data-t="wc" data-c="#ff9ecb" style="background:#ff9ecb"></span>
    <span class="sw" data-t="wc" data-c="#ff6a88" style="background:#ff6a88"></span>
    <span class="sw" data-t="wc" data-c="#ffb14e" style="background:#ffb14e"></span>
    <span class="sw" data-t="wc" data-c="#c9a0ff" style="background:#c9a0ff"></span>
    <span class="sw" data-t="wc" data-c="#7fe0d0" style="background:#7fe0d0"></span></div>
  <div id="spSave"></div>
  <button id="spClose">RESUME</button>
  <button id="spQuit">QUIT TO MAIN MENU</button>
</div></div>
<div id="taunt"><div class="tt"></div></div>
<div id="archive"><div class="ar">
  <div class="arh">PULSE ARCHIVE</div>
  <div id="arCount"></div>
  <div id="arFirst"></div>
  <div id="arList"></div>
  <button id="arClose">CLOSE</button>
</div></div>
<div class="sr" aria-live="polite">An interactive pixel-art story: a dark mirror, then a night train, then the truth.</div>

<script>
/* ===================== ASSETS ===================== */
const IMG={
 city:'assets/city.jpg',carriage:'assets/carriage.jpg',wrist:'assets/wrist.jpg',mark:'assets/mark.jpg',
 orangeOffer:'assets/orange_offer.jpg',orangeEat:'assets/orange_eat.jpg',orangeLeave:'assets/orange_leave.jpg',
 checkpoint:'assets/checkpoint.jpg',apart:'assets/checkpoint_apart.jpg',strangers:'assets/checkpoint_strangers.jpg',
 station:'assets/station.jpg',hideout:'assets/hideout.jpg',sweep:'assets/sweep.jpg',sayname:'assets/sayname.jpg',
 door:'assets/door.jpg',capture:'assets/capture.jpg',silence:'assets/silence.jpg',clinic:'assets/clinic.jpg',dream:'assets/dream.jpg',
 wristLeave:'assets/wrist_leave.jpg',reach:'assets/reach.jpg',
 crossback:'assets/crossback.jpg',drone:'assets/drone.jpg',wrenOrange:'assets/WREN_ORANGE.jpg',wrenMap:'assets/WREN_MAP.jpg',wrenDoor:'assets/WREN_DOOR.jpg',
 endWarm:'assets/END_WARM.jpg',endNight:'assets/END_NIGHT.jpg',endCold:'assets/END_COLD.jpg'};
Object.values(IMG).forEach(s=>{const i=new Image();i.src=s;});

/* ===================== LIVE CHOICE STATS (optional) =====================
   Paste your Supabase project URL + anon key below to switch on REAL percentages.
   Leave them empty and the game quietly uses the built-in estimates instead.
   Setup instructions: see MIRRORS_RELEASE_GUIDE.md                          */
const STATS_URL='';   // e.g. 'https://abcdefgh.supabase.co'
const STATS_KEY='';   // your anon/public key
const STATS_ON=!!(STATS_URL&&STATS_KEY);
let TALLY=null;
function statsBump(key){if(!STATS_ON)return;
  try{fetch(STATS_URL+'/rest/v1/rpc/bump',{method:'POST',
    headers:{'apikey':STATS_KEY,'Authorization':'Bearer '+STATS_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({k:key})}).catch(()=>{});}catch(e){}}
function statsFetch(){if(!STATS_ON)return Promise.resolve(null);
  try{return fetch(STATS_URL+'/rest/v1/tally?select=key,n',{headers:{'apikey':STATS_KEY,'Authorization':'Bearer '+STATS_KEY}})
    .then(r=>r.ok?r.json():null).then(rows=>{if(!rows)return null;const m={};rows.forEach(r=>m[r.key]=r.n);TALLY=m;return m;}).catch(()=>null);}
  catch(e){return Promise.resolve(null);}}
/* real % for one choice, or null if we don't have enough data */
function livePct(sig,opt){
  if(!TALLY)return null;
  let total=0,mine=0;
  Object.keys(TALLY).forEach(k=>{if(k.indexOf(sig+'|')===0){total+=TALLY[k];if(k===sig+'|'+opt)mine=TALLY[k];}});
  if(total<25)return null;              // too few players to be meaningful yet
  return Math.max(1,Math.round(mine/total*100));
}

/* ===================== PREFS / NAME / SAVE ===================== */
let NAME='YOU';try{NAME=localStorage.getItem('m_name')||'YOU';}catch(e){}

try{Object.assign(PREFS,JSON.parse(localStorage.getItem('m_prefs')||'{}'));}catch(e){}

let curMusicBase=0.35,REC=[],CKPT=null,LOADCK=null,currentHard=false;
const CKPTNAME={train:'the night train',hideout:'the hideout',sweep:'the sweep',reveal:'the mirror turns'};
function toast(msg){let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:88;'
     +'font-family:Georgia,serif;font-style:italic;font-size:12px;letter-spacing:2px;color:#bcd2e2;'
     +'background:rgba(8,10,18,.85);border:1px solid rgba(150,185,205,.28);border-radius:20px;padding:7px 18px;'
     +'opacity:0;transition:opacity .5s,transform .5s;pointer-events:none';
    document.body.appendChild(t);}
  t.textContent='✓ '+msg;
  requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(-12px)';},2600);}
function saveState(){try{localStorage.setItem('m_save',JSON.stringify({ck:CKPT,S:S,REC:REC,name:NAME}));}catch(e){}}

  const op=document.getElementById('opening');if(op&&op.style.display!=='none')return;

/* ===================== SOUND ===================== */
let AC,master,rainG,sndOn=true,fxIn=null,padGain=null,scoreTimer=null,scoreStop=false,scoreMood='calm';
let audioReady=false;
function initAudio(){if(audioReady)return;audioReady=true;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
  fxIn=AC.createGain();fxIn.gain.value=0.32;const dl=AC.createDelay();dl.delayTime.value=0.34;const fb=AC.createGain();fb.gain.value=0.33;const flp=AC.createBiquadFilter();flp.type='lowpass';flp.frequency.value=1700;fxIn.connect(dl);dl.connect(flp);flp.connect(fb);fb.connect(dl);flp.connect(master);
  /* synth rain removed — the game uses your audio/rain.mp3 only */}
function tick(){if(!AC||!sndOn)return;const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=2000;
  g.gain.setValueAtTime(0.014,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.05);o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.06);}
function note(f,t0,dur,v,send){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.04);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(master);if(send&&fxIn)g.connect(fxIn);o.start(t0);o.stop(t0+dur+0.06);}
/* warm minor pad + slow recurring motif (A minor). Fades out if the user's own music.mp3 loads. */
let scoreStarted=false;
function startScore(){if(!AC||scoreStarted)return;scoreStarted=true;try{scoreStop=false;padGain=AC.createGain();padGain.gain.value=0;padGain.connect(master);
  [110,164.81,220,261.63].forEach((f,idx)=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=560;o.type=idx<2?'sine':'triangle';o.frequency.value=f;o.detune.value=(idx%2?5:-5);g.gain.value=idx===3?0.022:0.05;o.connect(lp);lp.connect(g);g.connect(padGain);o.start();});
  padGain.gain.linearRampToValueAtTime(fileMusicActive?0:0.5,AC.currentTime+4);scheduleMotif();}catch(e){}}
const PHRASES=[[[440,0,1.7],[523.25,1.5,1.8],[659.25,3.2,2.6]],[[659.25,0,1.6],[587.33,1.4,1.8],[440,3.0,2.8]],[[523.25,0,1.9],[493.88,1.7,1.9],[329.63,3.3,3.0]],[[329.63,0,2.2],[440,2.0,2.0],[523.25,3.8,2.8]]];
function scheduleMotif(){if(scoreStop||!AC)return;const gap=(scoreMood==='escape'?6:11)+Math.random()*4;
  if(sndOn&&!fileMusicActive){const ph=PHRASES[(Math.random()*PHRASES.length)|0],t0=AC.currentTime+0.1;ph.forEach(([f,b,d])=>note(f,t0+b*1.15,d,0.05,true));note(scoreMood==='escape'?116.54:110,t0,4.4,0.03,false);}
  scoreTimer=setTimeout(scheduleMotif,gap*1000);}
function scoreReveal(){if(!AC)return;try{scoreMood='reveal';if(padGain)padGain.gain.linearRampToValueAtTime(0.0,AC.currentTime+3);
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;o.type='sine';o.frequency.setValueAtTime(72,AC.currentTime);o.frequency.exponentialRampToValueAtTime(46,AC.currentTime+6.5);g.gain.setValueAtTime(0.0001,AC.currentTime);g.gain.linearRampToValueAtTime(0.13,AC.currentTime+2.6);g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+7.5);o.connect(lp);lp.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+7.6);
  setTimeout(()=>{if(padGain&&!fileMusicActive)padGain.gain.linearRampToValueAtTime(0.42,AC.currentTime+5);},6500);}catch(e){}}
function fadeScoreForFile(){if(padGain&&AC)padGain.gain.linearRampToValueAtTime(0,AC.currentTime+3);scoreStop=true;}
function motif(slow){if(!AC||!sndOn||fileMusicActive)return;const t0=AC.currentTime;[[440,0,2.2],[523.25,1.7,2.2],[659.25,3.4,2.8],[880,5.2,3.4]].forEach(([f,b,d])=>note(f,t0+b,d,0.05,true));note(220,t0,9,0.028,false);}
let droneOn=false;
function drone(){if(!AC||!sndOn||droneOn)return;droneOn=true;[55,55.4].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=280;o.type='sine';o.frequency.value=f;g.gain.value=0.04;o.connect(lp);lp.connect(g);g.connect(master);o.start();});}
function toggleSnd(){sndOn=!sndOn;document.getElementById('snd').textContent=sndOn?'♪ on':'♪ off';if(master)master.gain.value=sndOn?0.7:0;if(musicEl)musicEl.muted=!sndOn;if(rainEl2)rainEl2.muted=!sndOn;}
/* ---- DROP-IN AUDIO: make a folder called "audio" next to this file and put mp3s in it ---- */
let fileMusicActive=false, musicEl=null, rainEl2=null, curRainV2=0;
function tryAudio(url,onok){const a=new Audio();let done=false;a.addEventListener('canplaythrough',()=>{if(!done){done=true;onok(a);}},{once:true});a.addEventListener('error',()=>{},{once:true});a.src=url;a.load();}
function fadeAudio(a,to,ms){const from=a.volume,t0=performance.now();(function s(){const k=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k<1)requestAnimationFrame(s);})();}
function setupFileAudio(){
  tryAudio('audio/menu.mp3',a=>{a.loop=true;a.volume=0;musicEl=a;fileMusicActive=true;a.muted=!sndOn;a.play().catch(()=>{});curMusicBase=0.35;fadeAudio(a,0.35*PREFS.mv,2600);fadeScoreForFile();});
}
/* rain starts as early as the browser allows — before "start game" if possible */
function startRainEarly(){tryAudio('audio/rain.mp3',a=>{a.loop=true;a.volume=0;rainEl2=a;a.muted=!sndOn;
  a.setAttribute('playsinline','');
  const ok=()=>fadeAudio(a,0.45*PREFS.rv,2200);
  const EV=['pointerdown','pointermove','mousemove','keydown','touchstart','wheel','scroll','click'];
  const arm=()=>{EV.forEach(e=>document.removeEventListener(e,arm,true));a.play().then(ok).catch(()=>{});};
  a.play().then(ok).catch(()=>{EV.forEach(e=>document.addEventListener(e,arm,true));});});}
startRainEarly();
function setRainFile(v){curRainV2=v;if(rainEl2)fadeAudio(rainEl2,Math.min(1,(0.10+v*0.75))*PREFS.rv,1600);}
function stopMusicSoft(){if(musicEl){const old=musicEl;musicEl=null;fadeAudio(old,0,2400);setTimeout(()=>{try{old.pause();}catch(e){}},2500);}fileMusicActive=true;}
function playMusic(name){tryAudio('audio/'+name+'.mp3',a=>{a.loop=true;a.volume=0;a.muted=!sndOn;a.play().catch(()=>{});const old=musicEl;musicEl=a;fileMusicActive=true;try{fadeScoreForFile();}catch(e){}curMusicBase=(name==='escape')?0.5:0.35;fadeAudio(a,curMusicBase*PREFS.mv,2200);if(old){fadeAudio(old,0,1800);setTimeout(()=>{try{old.pause();}catch(e){}},1900);}});}
function sfx(name){if(!sndOn)return;try{const a=new Audio('audio/'+name+'.mp3');a.volume=Math.min(1,0.6*PREFS.sv);a.play().catch(()=>{});}catch(e){}}
function fadeOutAll(){try{if(musicEl)fadeAudio(musicEl,0,5000);if(rainEl2)fadeAudio(rainEl2,0,5000);if(AC&&master)master.gain.linearRampToValueAtTime(0.0001,AC.currentTime+5);}catch(e){}}

/* ===================== MIRROR (dark object) ===================== */
const mc=document.getElementById('mcanvas'),mx2=mc.getContext('2d'),mline=document.getElementById('mline'),mstep=document.getElementById('mstep');
let MW,MH,pmx=0.5,pmy=0.5,gx=0,gy=0,dust=[],mt=0,mirrorOn=false;
function msize(){MW=mc.width=window.innerWidth;MH=mc.height=window.innerHeight;}
window.addEventListener('resize',msize);
for(let i=0;i<26;i++)dust.push({x:Math.random(),y:Math.random(),s:0.02+Math.random()*0.04,r:0.5+Math.random()*1.2});
window.addEventListener('mousemove',e=>{pmx=e.clientX/window.innerWidth;pmy=e.clientY/window.innerHeight;});
function rrect(x,y,w,h,r){mx2.beginPath();mx2.moveTo(x+r,y);mx2.arcTo(x+w,y,x+w,y+h,r);mx2.arcTo(x+w,y+h,x,y+h,r);mx2.arcTo(x,y+h,x,y,r);mx2.arcTo(x,y,x+w,y,r);mx2.closePath();}
let mdrops=[];for(let i=0;i<40;i++)mdrops.push({x:Math.random(),y:Math.random(),r:2+Math.random()*3.5,v:0.02+Math.random()*0.05});
function mFlick(s){return 0.78+0.22*Math.abs(Math.sin(mt*s)+Math.sin(mt*s*1.7)*0.5);}
function mRR(x,y,w,h,r){mx2.beginPath();mx2.moveTo(x+r,y);mx2.arcTo(x+w,y,x+w,y+h,r);mx2.arcTo(x+w,y+h,x,y+h,r);mx2.arcTo(x,y+h,x,y,r);mx2.arcTo(x,y,x+w,y,r);mx2.closePath();}
function mBead(px,py,r){const g=mx2.createRadialGradient(px-r*0.3,py-r*0.35,r*0.1,px,py,r);
  g.addColorStop(0,'rgba(210,232,248,0.34)');g.addColorStop(.45,'rgba(130,160,185,0.14)');g.addColorStop(.86,'rgba(20,32,45,0.30)');g.addColorStop(1,'rgba(20,32,45,0)');
  mx2.fillStyle=g;mx2.beginPath();mx2.arc(px,py,r,0,7);mx2.fill();
  mx2.fillStyle='rgba(240,250,255,0.75)';mx2.beginPath();mx2.arc(px-r*0.34,py-r*0.36,r*0.2,0,7);mx2.fill();}
/* the neon glass mirror (used for the interlude + finale) */
function mdrawGlass(){
  mt+=0.016;gx+=((pmx-0.5)-gx)*0.04;gy+=((pmy-0.5)-gy)*0.04;
  const W=MW,H=MH;
  const bg=mx2.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0c16');bg.addColorStop(.55,'#070810');bg.addColorStop(1,'#04050b');
  mx2.fillStyle=bg;mx2.fillRect(0,0,W,H);
  /* distant neon haze */
  mx2.save();mx2.globalCompositeOperation='lighter';
  let hz=mx2.createRadialGradient(W*0.16,H*0.52,10,W*0.16,H*0.52,W*0.3);hz.addColorStop(0,'rgba(255,93,177,0.06)');hz.addColorStop(1,'rgba(255,93,177,0)');mx2.fillStyle=hz;mx2.fillRect(0,0,W,H);
  let hz2=mx2.createRadialGradient(W*0.84,H*0.3,10,W*0.84,H*0.3,W*0.3);hz2.addColorStop(0,'rgba(73,224,255,0.06)');hz2.addColorStop(1,'rgba(73,224,255,0)');mx2.fillStyle=hz2;mx2.fillRect(0,0,W,H);
  mx2.restore();
  const mw=Math.min(430,W*0.42),mh=Math.min(H*0.72,620),rx=W/2-mw/2,ry=H/2-mh/2,R=14,f1=mFlick(6),f2=mFlick(9);
  /* neon frame glow */
  mx2.save();mx2.shadowColor='#49e0ff';mx2.shadowBlur=30*f1;mRR(rx-9,ry-9,mw+18,mh+18,R+6);mx2.strokeStyle='rgba(90,222,255,'+(0.8*f1)+')';mx2.lineWidth=3;mx2.stroke();mx2.restore();
  mx2.save();mx2.shadowColor='#ff5db1';mx2.shadowBlur=16*f2;mRR(rx-4,ry-4,mw+8,mh+8,R+3);mx2.strokeStyle='rgba(255,110,190,'+(0.45*f2)+')';mx2.lineWidth=1.5;mx2.stroke();mx2.restore();
  /* metal frame */
  mx2.save();mRR(rx-9,ry-9,mw+18,mh+18,R+6);const fg=mx2.createLinearGradient(rx,0,rx+mw,0);
  fg.addColorStop(0,'#171a22');fg.addColorStop(.5,'#2b313a');fg.addColorStop(1,'#12141a');mx2.fillStyle=fg;mx2.fill();
  mRR(rx-3,ry-3,mw+6,mh+6,R+3);mx2.fillStyle='#04060b';mx2.fill();mx2.restore();
  /* glass */
  mx2.save();mRR(rx,ry,mw,mh,R);mx2.clip();
  const gg=mx2.createLinearGradient(0,ry,0,ry+mh);gg.addColorStop(0,'#1c2c40');gg.addColorStop(.5,'#111f2e');gg.addColorStop(1,'#0e1826');
  mx2.fillStyle=gg;mx2.fillRect(rx,ry,mw,mh);
  mx2.globalCompositeOperation='lighter';
  const rT=mx2.createRadialGradient(rx+mw*0.5,ry+mh*0.14,4,rx+mw*0.5,ry+mh*0.14,mw*0.9);
  rT.addColorStop(0,'rgba(73,224,255,'+(0.20*f1)+')');rT.addColorStop(1,'rgba(73,224,255,0)');mx2.fillStyle=rT;mx2.fillRect(rx,ry,mw,mh);
  const rP=mx2.createRadialGradient(rx+mw*(0.24+gx*0.1),ry+mh*0.45,4,rx+mw*0.24,ry+mh*0.45,mw*0.75);
  rP.addColorStop(0,'rgba(255,93,177,'+(0.13*f2)+')');rP.addColorStop(1,'rgba(255,93,177,0)');mx2.fillStyle=rP;mx2.fillRect(rx,ry,mw,mh);
  const rB=mx2.createLinearGradient(0,ry+mh,0,ry+mh*0.62);
  rB.addColorStop(0,'rgba(73,200,235,0.12)');rB.addColorStop(1,'rgba(73,200,235,0)');mx2.fillStyle=rB;mx2.fillRect(rx,ry,mw,mh);
  mx2.globalCompositeOperation='source-over';
  /* sheen */
  const sg=mx2.createLinearGradient(rx,ry,rx+mw,ry+mh);
  sg.addColorStop(.2,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(220,240,255,0.10)');sg.addColorStop(.8,'rgba(255,255,255,0)');
  mx2.fillStyle=sg;mx2.fillRect(rx,ry,mw,mh);
  /* the watcher: a soft breathing presence where a face would be */
  const cyr=ry+mh*0.42,cxr=rx+mw*0.5-gx*mw*0.06;
  const br=0.045+0.03*Math.sin(mt*0.9);
  const pg=mx2.createRadialGradient(cxr,cyr,4,cxr,cyr,mw*0.46);
  pg.addColorStop(0,'rgba(150,205,235,'+br+')');pg.addColorStop(1,'rgba(150,205,235,0)');
  mx2.fillStyle=pg;mx2.beginPath();mx2.ellipse(cxr,cyr,mw*0.3,mh*0.34,0,0,7);mx2.fill();
  /* droplets */
  for(const d of mdrops){d.y+=d.v*0.004;if(d.y>1.04){d.y=-0.04;d.x=Math.random();}mBead(rx+d.x*mw,ry+d.y*mh,d.r);}
  /* inner edge */
  mx2.strokeStyle='rgba(200,230,255,0.18)';mx2.lineWidth=2;mRR(rx+2,ry+2,mw-4,mh-4,R);mx2.stroke();
  mx2.restore();
  /* vignette */
  const v=mx2.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.8);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.72)');mx2.fillStyle=v;mx2.fillRect(0,0,W,H);
  if(mirrorOn)requestAnimationFrame(mdraw);
}
function mdraw(){
  if(!mirrorOn)return;
  if(finalMode){mdrawGlass();return;}
  mt+=0.016; gx+=((pmx-0.5)-gx)*0.05; gy+=((pmy-0.5)-gy)*0.05;
  const rg=mx2.createRadialGradient(MW/2,MH*0.44,30,MW/2,MH/2,Math.max(MW,MH)*0.72);
  rg.addColorStop(0,'#0a1018');rg.addColorStop(.6,'#06090f');rg.addColorStop(1,'#020306');
  mx2.fillStyle=rg;mx2.fillRect(0,0,MW,MH);
  mx2.globalCompositeOperation='lighter';
  for(const d of dust){d.y-=d.s*0.4;if(d.y<-0.02){d.y=1.02;d.x=Math.random();}
    mx2.globalAlpha=0.05*(0.5+0.5*Math.sin(mt*2+d.x*30));mx2.fillStyle='#8fbfd8';mx2.beginPath();mx2.arc(d.x*MW,d.y*MH,d.r,0,7);mx2.fill();}
  mx2.globalAlpha=1;mx2.globalCompositeOperation='source-over';

/* draw tips the player hasn't seen before; only recycle once everything's been shown */
function pickTips(k,n){
  n=n||2;
  let seen=[];try{seen=JSON.parse(localStorage.getItem('m_seentips')||'[]');}catch(e){}
  const own=TIPS[k].slice(),any=TIPS_ANY.slice();
  const pickFrom=(pool)=>{
    let fresh=pool.filter(t=>seen.indexOf(t)<0);
    if(!fresh.length)fresh=pool.slice();
    return fresh[(Math.random()*fresh.length)|0];};
  const out=[];
  const first=pickFrom(own);out.push(first);seen.push(first);
  if(n>1){const second=pickFrom(any.filter(t=>out.indexOf(t)<0));out.push(second);seen.push(second);}
  try{if(seen.length>60)seen=seen.slice(-40);localStorage.setItem('m_seentips',JSON.stringify(seen));}catch(e){}
  return out;}
function getTip(k){return pickTips(k,1)[0];}

function drawPulse(cv,key){
  const col=PCOL[key||PKEY]||PCOL.RUN,CS=col[0],CR=col[1];
  const x=cv.getContext('2d'),W=cv.width,H=cv.height,mid=H*0.56;
  const beats=REC.map(r=>r.sil?0:(r.warm>0?1:0.42));
  if(S.reached)beats.push(1.35);
  let seg=[],px=0;
  const step=W/(beats.length+1.5);
  const GRID=CR+'0.13)',GRID2=CR+'0.07)';
  x.clearRect(0,0,W,H);
  /* build path points */
  const pts=[[0,mid]];px=step*0.4;
  beats.forEach((b,i)=>{
    if(b===0){pts.push([px+step*0.8,mid]);px+=step;return;} /* silence: flatline */
    const skip=(S.letGo&&i===Math.min(4,beats.length-1));
    if(skip){pts.push([px+step*0.9,mid]);px+=step*1.15;} /* skipped beat gap */
    pts.push([px,mid]);pts.push([px+step*0.16,mid-6*b]);pts.push([px+step*0.3,mid+H*0.11*b]);
    pts.push([px+step*0.42,mid-H*0.34*b]);pts.push([px+step*0.54,mid+H*0.16*b]);pts.push([px+step*0.68,mid]);
    px+=step;});
  pts.push([W,mid]);
  /* animate the trace — loops forever like a real monitor */
  let prog=0;const total=pts.length,SP=0.5;
  if(cv._stop)cv._stop();let alive=true;cv._stop=()=>{alive=false;};
  (function anim(){
    if(!alive)return;
    prog+=SP;if(prog>total+26)prog=0;
    const shown=Math.min(total,Math.floor(prog));
    x.clearRect(0,0,W,H);
    x.lineWidth=1;
    x.strokeStyle=GRID2;
    for(let gx=0;gx<W;gx+=13){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}
    for(let gy=0;gy<H;gy+=13){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}
    x.strokeStyle=GRID;
    for(let gx=0;gx<W;gx+=65){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}
    for(let gy=0;gy<H;gy+=65){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}
    x.save();x.lineJoin='round';x.lineWidth=2.2;
    /* fading tail behind the sweep */
    for(let i=1;i<shown;i++){const a=Math.max(0.12,1-(shown-i)/95);
      x.strokeStyle=CR+a+')';x.shadowColor=CS;x.shadowBlur=a>0.6?12:0;
      x.beginPath();x.moveTo(pts[i-1][0],pts[i-1][1]);x.lineTo(pts[i][0],pts[i][1]);x.stroke();}
    x.restore();
    const tip=pts[Math.max(0,shown-1)];
    if(tip&&shown<total){x.fillStyle='#fff';x.shadowColor=CS;x.shadowBlur=18;x.beginPath();x.arc(tip[0],tip[1],3,0,7);x.fill();x.shadowBlur=0;}
    requestAnimationFrame(anim);})();}

/* a small idealised heartbeat per pattern, for the archive rows */
function drawMiniPulse(cv,key){
  const x=cv.getContext('2d'),W=cv.width,H=cv.height,mid=H*0.56;
  const shapes={RUN:[1,1,1,1],BREATH:[0.95,0.25,1,0.9],HES:[0.5,0.85,0.4,0.9],COUNT:[0.5,0.28,0.55,0.28],FLAT:[0.32,0.32,0.32,0.32],MISS:[0.6,0.12,0.1,0.5],LOCKED:[0,0,0,0]};
  const b=shapes[key]||[0.6,0.6,0.6,0.6],pts=[[0,mid]];let px=W*0.06;const st=W*0.22;
  b.forEach(v=>{if(v===0){pts.push([px+st*0.8,mid]);px+=st;return;}
    pts.push([px,mid]);pts.push([px+st*0.14,mid-3*v]);pts.push([px+st*0.28,mid+H*0.12*v]);
    pts.push([px+st*0.4,mid-H*0.36*v]);pts.push([px+st*0.52,mid+H*0.15*v]);pts.push([px+st*0.66,mid]);px+=st;});
  pts.push([W,mid]);
  let prog=0;const total=pts.length,mc=PCOL[key]||['#4c4458','rgba(76,68,88,'];
  if(cv._stop)cv._stop();let alive=true;cv._stop=()=>{alive=false;};
  (function anim(){if(!alive)return;prog+=0.5;if(prog>total+20)prog=0;
    const shown=Math.min(total,Math.floor(prog));x.clearRect(0,0,W,H);
    /* full trace, dim — so the shape is always readable */
    x.save();x.lineWidth=1.5;x.lineJoin='round';x.strokeStyle=mc[1]+'0.3)';
    x.beginPath();for(let i=0;i<total;i++){const p=pts[i];if(i===0)x.moveTo(p[0],p[1]);else x.lineTo(p[0],p[1]);}x.stroke();
    /* bright sweep travelling over it */
    for(let i=1;i<shown;i++){const a=1-(shown-i)/36;if(a<=0)continue;
      x.strokeStyle=mc[1]+a+')';x.shadowColor=mc[0];x.shadowBlur=a>0.5?9:0;
      x.beginPath();x.moveTo(pts[i-1][0],pts[i-1][1]);x.lineTo(pts[i][0],pts[i][1]);x.stroke();}
    x.restore();requestAnimationFrame(anim);})();}

/* ===== DEV SHORTCUTS — press D in game, or add ?dev to the address ===== */
function devShowCard(){window._devMode=true;const c=document.getElementById('card');
  c.style.transition='none';c.style.display='flex';c.style.opacity='1';c.style.background='rgba(2,2,6,.88)';
  void c.offsetWidth;setTimeout(()=>{c.style.transition='opacity 1.3s';},60);}
function devJump(which){try{
  stopPulseSound();hushRain(600);if(musicEl)fadeAudio(musicEl,0,600);
  const c0=document.getElementById('card');if(c0){c0.onclick=null;c0.style.display='none';c0.style.opacity=0;}
  closeArchive();
  document.getElementById('setPanel').style.display='none';
  document.getElementById('opening').style.display='none';
  document.getElementById('cap').style.display='none';
  document.getElementById('barTop').style.display='none';document.getElementById('barBot').style.display='none';
  try{initAudio();}catch(e){}
  if(which==='pulse'||which==='partner'||which==='tip'||which==='shelf'||which==='stats'){
    if(!REC.length){REC=[{sig:'Leave your hand',label:'Leave your hand where it is',warm:1},{sig:'Eat it. Tell her',label:'Eat it. Tell her it’s good.',warm:1},
      {sig:'Hold on.',label:'Hold on. “We don’t split up.”',warm:1},{sig:'Call her name',label:'Call her name.',warm:1},
      {sig:'Pull her with you',label:'Pull her with you.',warm:1},{sig:'Reach for her',label:'Reach for her.',warm:1}];
      S.warmth=4;S.reached=true;S.promise=1;}
    if(which==='stats'){runResults();return;}
    const p=pulseRead();addCollected(p.key);
    if(which==='pulse'){runResultsPulseOnly(p);}
    else if(which==='partner')showPartner(p);
    else if(which==='tip')showTip(p);
    else showShelf(p);
    devShowCard();
    return;}
  /* jump into the REAL story at a checkpoint and keep playing */
  if(which.indexOf('scene:')===0){
    const ck=which.split(':')[1];
    document.getElementById('card').style.display='none';
    if(!REC.length){S.warmth=3;S.reached=true;S.promise=1;S.called=1;S.orangeLeft=false;S.apart=false;S.letGo=false;}
    if(rainEl2)fadeAudio(rainEl2,0.16*PREFS.rv,1200);
    LOADCK=ck;startStory();return;}
  if(which==='mirrorMid'){document.getElementById('card').style.display='none';
    mirrorCut(['Stop.','_Not yet._ You have heard that word so many times. It was never yours.','You lived this story once — from the safe side of it.','Now come here. Live it the way she did.','Don’t look away. You owe her that much.'],
      ()=>{document.getElementById('cap').style.display='block';setBG('clinic',false);});return;}
  if(which==='mirrorEnd'){document.getElementById('card').style.display='none';
    mirrorCut(['…That’s all of it. That is everything she never let you see.','She carried it the whole way, so you wouldn’t have to.','Come back through now. Back to your side of the glass.','There is one door left. It only opens from your side.'],
      ()=>{document.getElementById('cap').style.display='block';});return;}
  if(which==='mirrorFin'){document.getElementById('card').style.display='none';
    mirrorFinale(['You stayed. Nearly every time. You’d rather be ruined together than safe apart.',
      'She bought you a year. Then she bought you a life. Go and be bored with it — that’s the only thank-you she ever wanted.',
      (NAME&&NAME!=='YOU')?('…'+NAME+'. There you are. I told you I would keep it.'):'…There you are.'],null);return;}
  if(which==='archive'){openArchive();return;}
  if(which==='end'){theEnd();return;}
}catch(err){
  const c=document.getElementById('card');
  c.querySelector('.ct').innerHTML='<div style="color:#ff8a8a;font-style:normal;font-family:monospace;font-size:13px;text-align:left">DEV ERROR:<br>'+(err&&err.message?err.message:err)+'<br><br>'+((err&&err.stack)?err.stack.split('\n').slice(0,4).join('<br>'):'')+'</div>';
  devShowCard();c.onclick=()=>{c.style.opacity=0;setTimeout(()=>c.style.display='none',400);};}
}

    return out.concat(['It is '+time+' where you are. '+(h<6?'The good people are asleep.':(h<12?'You have things you are supposed to be doing.':(h<18?'You stepped out of your day to sit with me.':'Late enough that no one expects anything more of you tonight.'))),
      'A '+wd+'. Nobody remembers a '+wd+'. You will remember this one.',
      'You have been here about '+secs+' seconds. I have counted every one of them.',
      'I can’t see your face. I don’t need to. I can see how long you waited before you touched anything.',
      'You are not going to close this. You already know that. So do I.',
      'There is a light on somewhere behind you. You will forget to turn it off.',
      'The others in your house don’t know what you are about to do. Neither do you.',
      'You came here to feel something. Hold still — I am good at this.',
      'You think you are the one watching. Look how still you have gone.',
      'Whatever you choose, I am still here at the end. I am always at the end.']);}
  var q=[],mtok=0;function shf(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,s=a[i];a[i]=a[j];a[j]=s;}return a;}
  function murmur(){var my=mtok;if(q.length===0)q=shf(buildLines());var txt=q.shift();line.style.opacity=0;setTimeout(function(){if(my!==mtok)return;line.textContent=txt;line.style.opacity=1;setTimeout(function(){if(my===mtok)murmur();},4800);},900);}
  /* on touch: start mirrored, then right themselves once so they can be read */
  try{if(window.matchMedia&&window.matchMedia('(hover:none),(pointer:coarse)').matches){
    var mn0=document.getElementById('oMenu');if(mn0){mn0.classList.add('mirrored');
      setTimeout(function(){mn0.classList.remove('mirrored');},2400);}}}catch(e){}
  try{if(getCollected().length>0){const ar=document.getElementById('oArch');ar.style.display='block';
    let seenArch=false;try{seenArch=!!localStorage.getItem('m_archseen');}catch(e){}
    if(!seenArch){ar.classList.add('fresh');const sp=ar.querySelector('.omt');if(sp)sp.textContent='pulse archive ✦';
      ar.addEventListener('click',()=>{try{localStorage.setItem('m_archseen','1');}catch(e){}
        ar.classList.remove('fresh');if(sp)sp.textContent='pulse archive';},{once:true});}
  }}catch(e){}
  var nameAsk=document.getElementById('nameAsk'),nameIn=document.getElementById('nameIn'),nameGo=document.getElementById('nameGo');
  function afterName(){nameAsk.style.opacity=0;setTimeout(function(){nameAsk.style.display='none';},1000);mtok++;murmur();setTimeout(function(){step.style.opacity=1;},9000);}
  function submitName(){var v=(nameIn.value||'').trim();if(v){NAME=v;try{localStorage.setItem('m_name',v);}catch(e){}}afterName();}
  function begin(skipName){if(story)return;story=true;zoomT=0;menu.style.opacity=0;try{initAudio();setupFileAudio();drone();startScore();}catch(e){}
    setTimeout(function(){
      if(skipName===true){mtok++;murmur();setTimeout(function(){step.style.opacity=1;},9000);return;}
      nameAsk.style.display='flex';requestAnimationFrame(function(){nameAsk.style.opacity=1;});
      try{nameIn.focus();}catch(e){}
    },2700);}
  function enter(){if(dead)return;dead=true;mtok++;try{playMusic('music');}catch(e){}wrap.style.opacity=0;setTimeout(function(){wrap.style.display='none';startStory();},1600);}
  document.getElementById('oStart').addEventListener('click',function(){LOADCK=null;begin(false);});
  document.getElementById('oLoad').addEventListener('click',function(){
    if(story)return;
    var sv=loadState();
    if(!sv||!sv.ck){mtok++;line.textContent='There is nothing to load. You have not left anything behind yet.';line.style.opacity=1;
      setTimeout(function(){line.style.opacity=0;},3200);return;}
    NAME=sv.name||NAME;try{Object.assign(S,sv.S||{});}catch(e){}REC=sv.REC||[];LOADCK=sv.ck;
    toast('resuming · '+(CKPTNAME[sv.ck]||sv.ck));
    mtok++;line.textContent='I kept your place. '+(CKPTNAME[sv.ck]||sv.ck)+'.';line.style.opacity=1;
    begin(true);
    setTimeout(function(){enter();},3400);});
  document.getElementById('oSet').addEventListener('click',function(){document.getElementById('setPanel').style.display='flex';applyPrefs();});
  nameGo.addEventListener('click',submitName);
  nameIn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.stopPropagation();submitName();}});
  step.addEventListener('click',enter);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&story&&!dead&&step.style.opacity==='1')enter();});
})();
</script>
